<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bistrot Des Tournelles</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #8B0000 0%, #D4AF37 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 450px;
      width: 100%;
      padding: 2.5rem;
    }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo h1 { color: #8B0000; font-size: 1.8rem; }
    .logo p { color: #666; }
    
    .tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 2px solid #eee; }
    .tab {
      flex: 1;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      color: #666;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }
    .tab.active {
      color: #8B0000;
      border-bottom-color: #8B0000;
    }
    
    .form-group { margin-bottom: 1.2rem; }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #8B0000;
    }
    
    .btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #8B0000, #D4AF37);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    
    .divider {
      text-align: center;
      margin: 1.5rem 0;
      color: #999;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ddd;
    }
    .divider::before { left: 0; }
    .divider::after { right: 0; }
    
    .google-btn {
      width: 100%;
      padding: 0.8rem;
      background: white;
      border: 2px solid #ddd;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      transition: border-color 0.3s;
    }
    .google-btn:hover { border-color: #8B0000; }
    .google-btn img { width: 20px; }
    
    .otp-section {
      background: #f8f9fa;
      padding: 1rem;
      border-radius: 8px;
      margin: 1rem 0;
      text-align: center;
    }
    .otp-input {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin: 1rem 0;
    }
    .otp-input input {
      width: 45px;
      height: 50px;
      text-align: center;
      font-size: 1.2rem;
      border: 2px solid #ddd;
      border-radius: 8px;
    }
    
    .message {
      padding: 0.8rem;
      border-radius: 8px;
      margin: 1rem 0;
      text-align: center;
      display: none;
    }
    .message.success { background: #d4edda; color: #155724; }
    .message.error { background: #f8d7da; color: #721c24; }
    
    .switch-form {
      text-align: center;
      margin-top: 1.5rem;
      color: #666;
    }
    .switch-form a {
      color: #8B0000;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    
    @media (max-width: 480px) {
      .container { padding: 1.5rem; }
      .otp-input input { width: 40px; height: 45px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🍷 Bistrot Des Tournelles</h1>
      <p>Sign in to manage your reservations</p>
    </div>
    
    <div class="tabs">
      <div class="tab active" data-tab="login">Login</div>
      <div class="tab" data-tab="signup">Sign Up</div>
    </div>
    
    <!-- Login Form -->
    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label>Email or Phone</label>
        <input type="text" id="loginIdentifier" placeholder="email@example.com or +1234567890" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
    
    <!-- Signup Form (hidden by default) -->
    <form id="signupForm" class="auth-form" style="display: none;">
      <div class="form-group">
        <label>Sign up with</label>
        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
          <label style="flex: 1; text-align: center; padding: 0.8rem; border: 2px solid #ddd; border-radius: 8px; cursor: pointer;">
            <input type="radio" name="signupMethod" value="email" checked> 📧 Email
          </label>
          <label style="flex: 1; text-align: center; padding: 0.8rem; border: 2px solid #ddd; border-radius: 8px; cursor: pointer;">
            <input type="radio" name="signupMethod" value="phone"> 📱 Phone
          </label>
        </div>
      </div>
      
      <div id="emailSignup">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="email@example.com">
        </div>
      </div>
      
      <div id="phoneSignup" style="display: none;">
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="signupPhone" placeholder="+1234567890">
        </div>
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="••••••••" required>
      </div>
      
      <button type="submit" class="btn">Create Account</button>
    </form>
    
    <!-- OTP Verification (hidden) -->
    <div id="otpSection" class="otp-section" style="display: none;">
      <h3>🔐 Verify Your Account</h3>
      <p>We sent a code to <strong id="otpDestination"></strong></p>
      
      <div class="otp-input">
        <input type="text" maxlength="1" class="otp-digit" pattern="[0-9]">
        <input type="text" maxlength="1" class="otp-digit" pattern="[0-9]">
        <input type="text" maxlength="1" class="otp-digit" pattern="[0-9]">
        <input type="text" maxlength="1" class="otp-digit" pattern="[0-9]">
        <input type="text" maxlength="1" class="otp-digit" pattern="[0-9]">
        <input type="text" maxlength="1" class="otp-digit" pattern="[0-9]">
      </div>
      
      <button type="button" class="btn" id="verifyOtpBtn">Verify Code</button>
      <p style="margin-top: 1rem; font-size: 0.9rem; color: #666;">
        Didn't receive it? <a href="#" id="resendOtp">Resend code</a>
      </p>
    </div>
    
    <div class="divider">or continue with</div>
    
    <button class="google-btn" id="googleBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Sign in with Google
    </button>
    
    <div id="message" class="message"></div>
    
    <div class="switch-form">
      <span id="switchText">New here? <a id="switchLink">Create an account</a></span>
    </div>
  </div>

  <script>
    // Tab switching
    const tabs = document.querySelectorAll('.tab');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const otpSection = document.getElementById('otpSection');
    const message = document.getElementById('message');
    
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        if (tab.dataset.tab === 'login') {
          loginForm.style.display = 'block';
          signupForm.style.display = 'none';
          otpSection.style.display = 'none';
        } else {
          loginForm.style.display = 'none';
          signupForm.style.display = 'block';
          otpSection.style.display = 'none';
        }
      });
    });
    
    // Switch between login/signup
    document.getElementById('switchLink').addEventListener('click', () => {
      const isLogin = loginForm.style.display !== 'none';
      tabs.forEach(t => t.classList.remove('active'));
      tabs[isLogin ? 1 : 0].classList.add('active');
      loginForm.style.display = isLogin ? 'none' : 'block';
      signupForm.style.display = isLogin ? 'block' : 'none';
      document.getElementById('switchText').innerHTML = isLogin 
        ? 'Already have an account? <a id="switchLink">Sign in</a>'
        : 'New here? <a id="switchLink">Create an account</a>';
      document.getElementById('switchLink').addEventListener('click', arguments.callee);
    });
    
    // Toggle email/phone signup
    document.querySelectorAll('input[name="signupMethod"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        document.getElementById('emailSignup').style.display = e.target.value === 'email' ? 'block' : 'none';
        document.getElementById('phoneSignup').style.display = e.target.value === 'phone' ? 'block' : 'none';
      });
    });
    
    // OTP auto-focus
    document.querySelectorAll('.otp-digit').forEach((input, index, inputs) => {
      input.addEventListener('input', (e) => {
        if (e.target.value && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });
    
    // Show message helper
    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
      message.style.display = 'block';
      setTimeout(() => message.style.display = 'none', 5000);
    }
    
    // Login handler
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value;
      const password = document.getElementById('loginPassword').value;
      
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: identifier.includes('@') ? identifier : null,
            phone: identifier.includes('@') ? null : identifier,
            password
          })
        });
        
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('token', data.token);
          showMessage('Login successful! Redirecting...', 'success');
          setTimeout(() => window.location.href = '/admin/dashboard.html', 1500);
        } else {
          showMessage(data.error || 'Login failed', 'error');
        }
      } catch (error) {
        showMessage('Connection error', 'error');
      }
    });
    
    // Signup handler
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const method = document.querySelector('input[name="signupMethod"]:checked').value;
      const password = document.getElementById('signupPassword').value;
      const endpoint = method === 'email' ? '/api/auth/register/email' : '/api/auth/register/phone';
      const payload = {
        password,
        [method === 'email' ? 'email' : 'phone']: method === 'email' 
          ? document.getElementById('signupEmail').value 
          : document.getElementById('signupPhone').value
      };
      
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await response.json();
        if (response.ok) {
          document.getElementById('otpDestination').textContent = payload.email || payload.phone;
          loginForm.style.display = 'none';
          signupForm.style.display = 'none';
          otpSection.style.display = 'block';
          showMessage('Verification code sent!', 'success');
        } else {
          showMessage(data.error || 'Signup failed', 'error');
        }
      } catch (error) {
        showMessage('Connection error', 'error');
      }
    });
    
    // OTP verification
    document.getElementById('verifyOtpBtn').addEventListener('click', async () => {
      const otp = Array.from(document.querySelectorAll('.otp-digit')).map(i => i.value).join('');
      const email = document.getElementById('signupEmail')?.value;
      const phone = document.getElementById('signupPhone')?.value;
      
      try {
        const response = await fetch('/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, phone, otp })
        });
        
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('token', data.token);
          showMessage('Verification successful! Redirecting...', 'success');
          setTimeout(() => window.location.href = '/admin/dashboard.html', 1500);
        } else {
          showMessage(data.error || 'Invalid code', 'error');
        }
      } catch (error) {
        showMessage('Connection error', 'error');
      }
    });
    
    // Google sign-in (placeholder)
    document.getElementById('googleBtn').addEventListener('click', () => {
      // In production: window.location.href = '/api/auth/google';
      showMessage('Google sign-in requires API setup. Use email/phone for demo.', 'error');
    });
    
    // Resend OTP
    document.getElementById('resendOtp').addEventListener('click', (e) => {
      e.preventDefault();
      showMessage('Code resent! Check your inbox.', 'success');
    });
  </script>
</body>
</html>
