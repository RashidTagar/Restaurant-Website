<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Bistrot Des Tournelles</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #8B0000, #D4AF37);
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 400px;
        }
        h1 {
            text-align: center;
            color: #8B0000;
            margin-bottom: 2rem;
        }
        input {
            width: 100%;
            padding: 1rem;
            margin: 1rem 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 1rem;
            background: #D4AF37;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover {
            background: #8B0000;
            color: white;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🍷 Admin Login</h1>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login to Dashboard</button>
        </form>
        <p style="text-align: center; margin-top: 1rem; color: #666;">
            <a href="/" style="color: #8B0000;">← Back to Website</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Simple auth (in production, use proper JWT)
            if (username === 'admin' && password === 'bistrot2024') {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = '/admin/dashboard.html';
            } else {
                alert('❌ Invalid credentials!');
            }
        });
    </script>
</body>
</html>
